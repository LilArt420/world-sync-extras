# World Sync Extras: Constellation Tower block - the tower's monsters.
#
# kRO 2023 rebuilt the Endless Tower as the Constellation Tower (1@ch_t,
# 2@ch_t, 3@ch_t). rAthena has the instance and its maps but only
# commented-out entries for its monsters: 20994 MD_BETELGEUSE (the new
# owner), 20995 MD_G_DEADSOUL (his Dead Souls), 20996 MD_NAGHT_SIEGER
# (the old owner, cast out), 20997 MD_G_ENTWEIHEN_M (Naght Sieger's Thorny
# Skeletons), the floor monsters 20998-21047 and the bosses of every fifth
# floor 21325-21359 (MD_T_*, the old tower's monsters made stronger).
# Level, HP, attack, defense, resistances, stats, race, element, size,
# range, speed and drops are Divine Pride's; Attack/Attack2 are converted
# the way World Sync converts Divine Pride's ranges. Divine Pride shows no
# experience: ours is an estimate (the fifth-floor bosses: 1.5% of their
# HP, the floor monsters' ratio). Divine Pride shows no English names:
# the floor monsters keep their classic names. The tower script lowers
# the two finale bosses' HP to the difficulty you reach (see
# npc/when/constellation_tower/tower.txt).
