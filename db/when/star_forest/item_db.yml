# World Sync Extras: Star Forest block - item effects rAthena lacks.
#
# rAthena has the five jams without an effect. The effects are the ones
# kRO's Herosria update notes give (2022): Purple, all trait stats +5 for
# 30 minutes; Red, P.ATK +5; Blue, S.MATK +5; Yellow, C.Rate +5; White,
# RES +50 and MRES +50, each for 10 minutes. The Garden Herbalist in
# hero_lb makes them.
Header:
  Type: ITEM_DB
  Version: 3

Body:
  - Id: 101753
    AegisName: Heros_Purple_H_Jam
    Name: Herosria Purple Herb Jam
    Type: Usable
    Weight: 10
    Flags:
      BuyingStore: true
    Script: |
      bonus_script "{ bonus bAllTraitStats,5; }",1800,BSF_REM_ON_DEAD,0,EFST_BLANK;
      specialeffect2 EF_POTION_BERSERK;
