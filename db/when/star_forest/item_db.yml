  # Traveler's Leaf, sold in Ash Village: the client's description names
  # two places (Twisted Dark Land, Destroyed Geffen). Used up at once,
  # like the official one, even if the menu is cancelled.
  - Id: 104000
    AegisName: Ch1_Warp_Leaf
    Name: Traveler's Leaf
    Type: Usable
    Trade:
      NoDrop: true
      NoTrade: true
      NoCart: true
      NoStorage: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
    Script: |
      if (isbegin_quest(18372) >= 1)
        .@c = select("Twisted Dark Land:Destroyed Geffen:Cancel");
      else
        .@c = select("Twisted Dark Land:Cancel") == 1 ? 1 : 3;
      if (.@c == 1)
        warp "ygg_roots",325,147;
      else if (.@c == 2)
        warp "ch1_geffen",101,138;
