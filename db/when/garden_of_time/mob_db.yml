# World Sync Extras: Garden of Time block - the monsters of the two
# Dimensional Prison memorial dungeons (Lake of Fire, Hall of Life).
#
# 22177-22180 MD_PRI_DRAGON_1-4, the Four Divine Beasts of the Lake of Fire:
# rAthena only has name stubs for them (no stats, no drops). 22174
# MD_PRI_RIGEL (the Dimensional Criminal, Hall of Life) and 22175
# MD_PRI_RIGEL_AC (its illusions in the other world) are commented out in
# rAthena. Level, HP, attack, defense, resistances, stats, race, element,
# size, range, speed and drops are Divine Pride's (kRO 2023). Attack and
# Attack2 are converted the way World Sync converts Divine Pride's ranges
# (middle of the range minus Str/Int and level). Divine Pride shows no
# experience: ours follows the HP of the Episode 20/21 bosses.
# The Hall of Life script scales the criminal's HP and attack to the
# barrier level you bring in.
