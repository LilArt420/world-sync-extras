# World Sync Extras: Varmundt block - random options for the Encroached
# weapons the Zero Cell monsters drop (db/when/varmundt/mob_db.yml).
# Values from wiki.muhro.eu's "Encroached Weapon" page.
#
# Line 1 always comes from the group's first pool (Slot 1). Lines 2 and 3
# are two rolls on the second pool (MaxRandom 3, slot 1 already taken):
# each roll picks one entry and keeps it at its Chance, tuned so that a
# roll gives a line 50% of the time. So 25% of drops have one line, 50%
# two, 25% three. In the second pool the plain bonuses keep at 100% and
# the many per-element and per-race lines share the rest, so those come
# up about two times in three. In a magic group's line 1, "one element's
# magic damage" is one choice among six, so each of its ten elements is
# kept a tenth as often.
# Written by a script from these rules: keep the groups in step with each other.
