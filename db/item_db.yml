# The server's regional item table gives these items only the first job of each
# class line their text names ("Swordman, Thief and Merchant Classes" became
# Swordman, Thief, Merchant), so Knights, Wizards, Priests and the rest of each
# line, 3rd and 4th jobs included, couldn't equip them. Flux159/rathena#84
# fixes the table and its generator. These entries are its Jobs: rAthena
# replaces an item's whole job list with the one an import gives and leaves
# the rest of the item alone. Drop this file once the app ships #84.
